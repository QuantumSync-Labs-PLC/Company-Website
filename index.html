<!DOCTYPE html>
<html lang="en" class="bg-navy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & App Icon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/images/favicon-192.png" />

    <!-- DNS Prefetch & Preconnect for third-party resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Tailwind CSS -->
    <link href="/src/theme/tailwind.css" rel="stylesheet" />
    <!-- Google Fonts with display=swap for better performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>QuantumSync Labs</title>
    <meta
      name="description"
      content="QuantumSync Labs - Modern IT solutions, cloud, AI, and software engineering. Empowering digital transformation for your business."
    />
    <meta name="theme-color" content="#080E3F" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="QuantumSync Labs" />
    <meta
      property="og:description"
      content="Modern IT solutions, cloud, AI, and software engineering."
    />
    <meta property="og:image" content="/assets/images/og-logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quantumsynclabs.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuantumSync Labs" />
    <meta
      name="twitter:description"
      content="Modern IT solutions, cloud, AI, and software engineering."
    />
    <meta name="twitter:image" content="/assets/images/og-logo.png" />

    <!-- Robots for SEO -->
    <meta name="robots" content="index, follow" />
  </head>
  <body class="antialiased font-body bg-navy text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
