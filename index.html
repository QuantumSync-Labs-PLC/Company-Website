<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & App Icon -->
    <link rel="icon" type="image/webp" sizes="32x32" href="/assets/images/favicon-32.webp" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/images/favicon-192.webp" />

    <!-- DNS Prefetch & Preconnect for third-party resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Tailwind CSS -->
    <link href="/src/theme/tailwind.css" rel="stylesheet" />
    <!-- Google Fonts with display=swap for better performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>QuantumSync Labs</title>
    <meta
      name="description"
      content="QuantumSync Labs - Modern IT solutions, cloud, AI, and software engineering. Empowering digital transformation for your business."
    />
    <!-- Colours the browser chrome on Chrome and iOS Safari. Firefox and Opera
         ignore it, which is why compat linters flag it; see .hintrc. -->
    <meta name="theme-color" content="#060810" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="QuantumSync Labs" />
    <meta
      property="og:description"
      content="Modern IT solutions, cloud, AI, and software engineering."
    />
    <meta property="og:image" content="https://www.quantumsynclabs.com/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuantumSync Labs" />
    <meta property="og:url" content="https://www.quantumsynclabs.com/" />
    <link rel="canonical" href="https://www.quantumsynclabs.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuantumSync Labs" />
    <meta
      name="twitter:description"
      content="Modern IT solutions, cloud, AI, and software engineering."
    />
    <meta name="twitter:image" content="https://www.quantumsynclabs.com/og-image.webp" />

    <!-- Robots for SEO -->
    <meta name="robots" content="index, follow" />

    <!-- Sets the theme before first paint. See src/hooks/useTheme.jsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("qs-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var html = document.documentElement;
          html.setAttribute("data-theme", theme);
          html.classList.toggle("dark", theme === "dark");
        } catch (e) {
          /* blocked storage: the prefers-color-scheme block in CSS covers it */
        }
      })();
    </script>
  </head>
  <body class="antialiased font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
